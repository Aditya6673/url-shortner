server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
        secure: ${COOKIE_SECURE:false}

spring:
  application:
    name: url-shortener
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://admin:admin123@localhost:27017/urlshortener?authSource=admin}
      auto-index-creation: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  short-code-length: 7
  cors:
    allowed-origins: ${APP_BASE_URL:http://localhost:8080}
  billing:
    mock-upgrade-enabled: ${MOCK_UPGRADE_ENABLED:false}
  rate-limit:
    anonymous-links-per-hour: ${ANON_LINKS_PER_HOUR:20}
